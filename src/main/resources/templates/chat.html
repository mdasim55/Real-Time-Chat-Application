<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reak-Time Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>Real time chat Application </h1>
        <div id="chat"
            class="border rounded p-3 mb-3"
            style="height: 300px; overflow-y: auto;">
        </div>

        <div class="input-group mb-3">
            <input id="sender-input" type="text" class="form-control" placeholder="Your name..."/>
        </div>

        <div class="input-group mb-3">
            <input id="messageInput" type="text" class="form-control" placeholder="Type a message..."/>
            <div id="input-group-append">
                <button id="sendMessage" class="btn btn-primary">Send</button>
            </div>
        </div>

    </div>
</body>
<script>

    let stompClient;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {

        const socket = new SockJS('/chat');

        stompClient = new StompJs.Client({
            webSocketFactory: () => socket,

            onConnect: function (frame) {

                console.log("Connected: " + frame);

                setConnected(true);

                stompClient.subscribe('/topic/message', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            },

            onStompError: function (frame) {

                console.error("STOMP Error:", frame);

            }
        });

        stompClient.activate();
    }


    function showMessage(message) {

        const chat = document.getElementById('chat');

        const messageElement = document.createElement('div');

        messageElement.textContent =
            message.sender + ': ' + message.content;

        messageElement.className =
            "border-bottom mb-1";

        chat.appendChild(messageElement);

        chat.scrollTop = chat.scrollHeight;
    }


    function sendMessage() {

        const sender =
            document.getElementById('sender-input').value;

        const content =
            document.getElementById('messageInput').value;

        const chatMessage = {
            sender: sender,
            content: content
        };

        stompClient.publish({

            destination: '/app/sendMessage',

            body: JSON.stringify(chatMessage)

        });

        document.getElementById('messageInput').value = '';
    }


    document.getElementById('sendMessage').onclick = sendMessage;

    window.onload = connect;

</script>
</html>
